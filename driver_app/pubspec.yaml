name: rideapp_driver
description: RIDEAPP Driver App - Accept rides, earn money, track earnings
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Networking
  http: ^1.2.0
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.2.2

  # Location & Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.0
  geocoding: ^2.1.1

  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  cached_network_image: ^3.3.1

  # Auth & Security
  flutter_secure_storage: ^9.0.0

  # Notifications
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # Utilities
  image_picker: ^1.0.7
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
